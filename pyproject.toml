[project]
name = "jansetu-ai"
version = "0.1.0"
description = "Vernacular Citizen Services Assistant for Uttar Pradesh (AI Kaushal Hackathon)"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.1.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
